<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary metadata -->
    <title>SafeHerAI — Safety Intelligence for Every Journey</title>

    <meta
      name="description"
      content="SafeHerAI combines safer routing, trusted safety signals, Safety Bubble protection, and emergency assistance into one intelligent journey experience."
    />

    <meta
      name="keywords"
      content="SafeHerAI, safety, safe routing, safety intelligence, emergency assistance, Safety Bubble, navigation"
    />

    <meta name="author" content="SafeHerAI" />

    <!-- Theme -->
    <meta name="theme-color" content="#2563eb" />

    <!-- Mobile / browser UI -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="SafeHerAI"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Optional PNG fallback -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <!-- Apple icon -->
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="/"
    />

    <!-- Preconnect for faster font loading -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
  </head>

  <body>
    <noscript>
      SafeHerAI requires JavaScript to provide its interactive
      safety and routing experience.
    </noscript>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
